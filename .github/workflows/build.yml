name: Build VST3

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Тип сборки'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
  push:
    branches: [ main, master ]
    paths:
      - 'Source/**'
      - 'CMakeLists.txt'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64 VST3
    runs-on: windows-latest

    steps:
      # ============================================================
      # 1. Checkout репозитория с попыткой загрузить подмодули
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ============================================================
      # 2. Умная проверка и автозагрузка JUCE (ИСПРАВЛЕНИЕ ЗДЕСЬ)
      # ============================================================
      - name: Verify or Auto-clone JUCE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
         
          if (-not (Test-Path "JUCE/CMakeLists.txt")) {
            Write-Warning "JUCE submodule not found in repository."
            Write-Host "Auto-cloning JUCE framework to ensure build success..."
           
            # Клонируем только последний коммит для скорости
            git clone --depth 1 https://github.com/juce-framework/JUCE.git JUCE
           
            if (-not (Test-Path "JUCE/CMakeLists.txt")) {
              Write-Error "Failed to clone JUCE. Check network or repository URL."
              exit 1
            }
            Write-Host "✓ JUCE cloned successfully."
          } else {
            Write-Host "✓ JUCE submodule found in repository."
          }
         
          Write-Host "JUCE contents:"
          Get-ChildItem JUCE -Name | Select-Object -First 5

      # ============================================================
      # 3. Настройка окружения MSVC
      # ============================================================
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ============================================================
      # 4. Конфигурация CMake
      # ============================================================
      - name: Configure CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildType = "${{ github.event.inputs.build_type || 'Release' }}"
          Write-Host "Building configuration: $buildType"

          cmake -B build `
                -G "Visual Studio 17 2022" `
                -A x64 `
                -DCMAKE_BUILD_TYPE=$buildType

          Write-Host "✓ CMake configured successfully"

      # ============================================================
      # 5. Сборка проекта
      # ============================================================
      - name: Build VST3 plugin
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildType = "${{ github.event.inputs.build_type || 'Release' }}"

          cmake --build build `
                --config $buildType `
                --parallel

          Write-Host "✓ Build completed successfully"

      # ============================================================
      # 6. Проверка наличия собранного VST3 файла
      # ============================================================
      - name: Verify build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildType = "${{ github.event.inputs.build_type || 'Release' }}"
          $vst3Path = "build/HUNTERICE_FIRST_PLUGIN_artefacts/$buildType/VST3"

          if (-not (Test-Path $vst3Path)) {
            Write-Error "VST3 output directory not found at: $vst3Path"
            exit 1
          }

          $vst3Files = Get-ChildItem $vst3Path -Filter "*.vst3" -Recurse
          if ($vst3Files.Count -eq 0) {
            Write-Error "No .vst3 files found in $vst3Path"
            exit 1
          }

          Write-Host "✓ VST3 plugin found:"
          $vst3Files | ForEach-Object { Write-Host "  - $($_.Name) ($([math]::Round($_.Length/1MB, 2)) MB)" }

      # ============================================================
      # 7. Создание ZIP архива
      # ============================================================
      - name: Create ZIP archive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $buildType = "${{ github.event.inputs.build_type || 'Release' }}"

          $zipDir = "zip_staging/HUNTERICE_FIRST_PLUGIN"
          New-Item -ItemType Directory -Path $zipDir -Force | Out-Null

          $vst3Source = "build/HUNTERICE_FIRST_PLUGIN_artefacts/$buildType/VST3"
          Copy-Item -Path "$vst3Source/*" -Destination $zipDir -Recurse -Force

          if (Test-Path "README.md") { Copy-Item "README.md" $zipDir }
          if (Test-Path "LICENSE")   { Copy-Item "LICENSE" $zipDir }

          $zipName = "HUNTERICE_FIRST_PLUGIN-VST3-Windows-x64.zip"
          Compress-Archive -Path "zip_staging/*" -DestinationPath $zipName -Force

          Write-Host "✓ ZIP archive created: $zipName"

      # ============================================================
      # 8. Загрузка артефактов
      # ============================================================
      - name: Upload VST3 artifact (ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: HUNTERICE_FIRST_PLUGIN-VST3-Windows-x64
          path: HUNTERICE_FIRST_PLUGIN-VST3-Windows-x64.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload raw VST3 file
        uses: actions/upload-artifact@v4
        with:
          name: HUNTERICE_FIRST_PLUGIN-Raw-VST3
          path: build/HUNTERICE_FIRST_PLUGIN_artefacts/${{ github.event.inputs.build_type || 'Release' }}/VST3/
          retention-days: 30
          if-no-files-found: error
